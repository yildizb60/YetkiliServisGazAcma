<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Browser Form Regression Tests</title>
<h1>Browser Form Regression Tests</h1>
<output id="summary">Running</output>
<ol id="results"></ol>
<script type="module">
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const scripts = Object.fromEntries(await Promise.all(['toast', 'drawer', 'branch', 'permission', 'appointment', 'report', 'dropdown', 'commissioning', 'request', 'login'].map(async name =>
        [name, await (await fetch(`/${name}.js`)).text()])));
    const reportCss = await (await fetch('/report.css')).text();
    const requestCss = await (await fetch('/request.css')).text();
    const requestView = await (await fetch('/request-view.html')).text();
    const commissioningEntry = await (await fetch('/commissioning-entry.json')).json();
    const commissioningTable = await (await fetch('/commissioning-table.json')).json();
    scripts['commissioning-entry'] = commissioningEntry.script;
    const toastCss = await (await fetch('/toast.css')).text();
    const panelCss = (await Promise.all(['panel-layout', 'panel-unify'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const operationsCss = await (await fetch('/operations-directory.css')).text();
    const serviceEditorCss = await (await fetch('/service-editor.css')).text();
    const branchCss = await (await fetch('/branch.css')).text();
    const authCss = (await Promise.all(['login', 'registration'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const homeCalendarCss = (await Promise.all(['home-calendar', 'personnel-home'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const limits = await (await fetch('/appointment-limits.json')).json();
    const permissionFixture = await (await fetch('/permission-fixture.json')).json();
    const loginFixture = await (await fetch('/login-fixture.json')).json();
    const previewTest = new URLSearchParams(location.search).get('preview');
    let passed = 0, failed = 0;

    async function test(name, run) {
        if (previewTest && name !== previewTest) return;
        const frame = document.createElement('iframe');
        frame.title = name;
        const loaded = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
        frame.src = '/frame.html';
        document.body.append(frame);
        await loaded;
        frame.scrollIntoView({ block: 'nearest' });
        const win = frame.contentWindow, doc = win.document;
        const errors = [];
        win.addEventListener('error', event => errors.push(event.message));
        win.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
        const load = name => {
            const script = doc.createElement('script');
            script.textContent = scripts[name];
            doc.body.append(script);
        };
        try {
            await run(doc, win, load);
            assert(!errors.length, errors.join('; '));
            passed++;
            document.querySelector('#results').insertAdjacentHTML('beforeend', `<li>PASS: ${name}</li>`);
        } catch (error) {
            failed++;
            const item = document.createElement('li');
            item.textContent = `FAIL: ${name}: ${error.message}`;
            document.querySelector('#results').append(item);
        } finally {
            if (!previewTest) frame.remove();
        }
    }

    await test('Sign-in uses one role-independent form and keeps registration available', (doc, win, load) => {
        assert(!/data-login-mode|role="tab(?:list|panel)?"/.test(loginFixture.source), 'Sign-in still requires role tabs');
        doc.body.innerHTML = loginFixture.markup;
        load('login');
        assert(doc.querySelectorAll('#login-form').length === 1, 'A single login form is required');
        assert(!doc.querySelector('#kullanici-adi').value && !doc.querySelector('#sifre').value, 'Login preselects a development account');
        assert(!doc.querySelector('.login-registration').hidden, 'Registration depends on a removed role tab');
        assert(doc.querySelector('.login-register').getAttribute('href') === '/kayit/yetkili-servis', 'Registration destination changed');
        assert(!doc.querySelector('[name="rol"], [name="role"]'), 'Client supplies an authentication role');
    });

    await test('Unified login retains POST, antiforgery and error-to-OTP transitions', async (doc, win, load) => {
        doc.body.innerHTML = loginFixture.markup;
        const requests = [];
        win.fetch = async (url, options) => {
            requests.push(options);
            return { ok: true, url: new URL('/giris', win.location.href).href,
                text: async () => requests.length === 1
                    ? loginFixture.markup.replace('<h1>Giris</h1>', '<h1>Giris</h1><p class="login-message is-error">Giris bilgileri gecersiz</p>')
                    : '<main class="login-shell"><div class="login-card"><h1>Dogrulama Kodu</h1><form method="post" action="/giris/sms-dogrula"><input name="kod"><button type="submit">Tamamla</button></form></div></main>' };
        };
        load('login');
        for (let attempt = 0; attempt < 2; attempt++) {
            doc.querySelector('#kullanici-adi').value = 'login@example.test';
            doc.querySelector('#sifre').value = 'fixture-only';
            doc.querySelector('#login-form').requestSubmit();
            await new Promise(resolve => win.setTimeout(resolve, 0));
            assert(requests[attempt].method === 'POST', 'Login no longer posts');
            assert(requests[attempt].body.get('__RequestVerificationToken') === 'test-token', 'Antiforgery token was lost');
            assert(requests[attempt].body.get('kullaniciAdi') === 'login@example.test', 'Username was lost');
            if (attempt === 0) {
                assert(doc.querySelector('.login-message.is-error'), 'Server login error is not displayed');
                assert(!doc.querySelector('.login-registration').hidden, 'Registration disappears after failed sign-in');
            }
        }
        assert(doc.querySelector('form[action="/giris/sms-dogrula"]'), 'OTP transition depends on removed tabs');
        assert(!doc.querySelector('[data-login-network-error]'), 'Removing role tabs caused a script error');
    });

    for (const [width, height] of [[1280, 720], [1024, 650], [1920, 1080], [390, 844]]) {
        await test(`Registration showcase matches sign-in size at ${width}x${height}`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = `${height}px`;
            const style = doc.createElement('style');
            style.textContent = authCss;
            doc.head.append(style);
            doc.body.innerHTML = ['', 'registration-shell'].map(css => `<main class="login-shell login-shell--panel ${css}">
                <section class="login-visual"><div class="login-showcase__stage"><article class="login-showcase__slide is-active">
                <img class="login-showcase__device login-showcase__device--monitor" alt="">
                <img class="login-showcase__device login-showcase__device--laptop" alt="">
                <img class="login-showcase__overlay" alt=""></article></div></section>
                <section class="login-side ${css ? 'registration-side' : ''}"></section></main>`).join('');
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            const visuals = [...doc.querySelectorAll('.login-visual')];
            if (width <= 980) {
                assert(visuals.every(visual => win.getComputedStyle(visual).display === 'none'), 'Registration adds a mobile showcase that sign-in hides');
                return;
            }
            const stages = visuals.map(visual => visual.querySelector('.login-showcase__stage'));
            const [loginPanel, registrationPanel] = visuals.map(visual => visual.getBoundingClientRect());
            assert(Math.abs(loginPanel.width - registrationPanel.width) <= 1
                && Math.abs(loginPanel.height - registrationPanel.height) <= 1,
                `Visual panel sizes differ: ${loginPanel.width}x${loginPanel.height} vs ${registrationPanel.width}x${registrationPanel.height}`);
            const [login, registration] = stages.map(stage => stage.getBoundingClientRect());
            assert(Math.abs(login.width - registration.width) <= 1 && Math.abs(login.height - registration.height) <= 1,
                `Showcase sizes differ: ${login.width}x${login.height} vs ${registration.width}x${registration.height}`);
            const panel = visuals[1].getBoundingClientRect();
            assert(Math.abs((registration.left + registration.right) - (panel.left + panel.right)) <= 2
                && Math.abs((registration.top + registration.bottom) - (panel.top + panel.bottom)) <= 2, 'Registration showcase is not centered');
            assert(registration.left >= panel.left && registration.right <= panel.right && registration.top >= panel.top && registration.bottom <= panel.bottom,
                'Registration clips the showcase');
            for (const selector of ['.login-showcase__device--monitor', '.login-showcase__device--laptop', '.login-showcase__overlay']) {
                const [first, second] = stages.map(stage => win.getComputedStyle(stage.querySelector(selector)));
                assert(Math.abs(parseFloat(first.width) - parseFloat(second.width)) <= 1
                    && Math.abs(parseFloat(first.height) - parseFloat(second.height)) <= 1, `${selector} scales differently between pages`);
            }
        });
    }

    for (const [width, height] of [[1280, 720], [1024, 650], [1920, 1080], [390, 844]]) {
        await test(`Registration fields keep compact spacing at ${width}x${height}`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = `${height}px`;
            const style = doc.createElement('style');
            style.textContent = authCss;
            doc.head.append(style);
            doc.body.innerHTML = `<header class="login-topbar"></header>
                <main class="login-shell login-shell--panel registration-shell">
                <section class="login-visual"><div class="login-showcase__stage"></div></section>
                <section class="login-side registration-side"><form class="login-card registration-card">
                <header class="login-card-head registration-card-head"><h1>Yetkili Servis Kayit Ekrani</h1></header>
                <div class="registration-progress"><button type="button">Firma bilgileri</button><button type="button">Yetki ve hesap</button></div>
                <section class="registration-step-panel" data-registration-step="1"><div class="registration-field-grid">
                ${['Firma / Kurum Adi', 'Yetkili Ad Soyad', 'VKN', 'T.C. kimlik no', 'E-posta', 'Telefon', 'Il', 'Ilce', 'Adres'].map((label, index) =>
                    `<div class="registration-field ${index === 8 ? 'is-address' : ''}"><label for="field-${index}">${label} *</label><input id="field-${index}"><small class="registration-field-error" hidden></small></div>`).join('')}
                </div><footer class="registration-step-actions"><button class="registration-secondary" type="button">Girise Don</button><button class="registration-primary" type="button">Devam Et</button></footer>
                </section></form></section></main>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            const fields = [...doc.querySelectorAll('.registration-field')];
            const columns = width > 620 ? 2 : 1;
            const measure = () => {
                for (let i = 0; i < fields.length - columns; i++) {
                    const current = fields[i].getBoundingClientRect();
                    const next = fields[i + columns].getBoundingClientRect();
                    const gap = next.top - current.bottom;
                    assert(gap >= 6 && gap <= 11, `Field rows stretch apart: ${gap}px`);
                }
                const grid = doc.querySelector('.registration-field-grid');
                assert(grid.scrollHeight <= grid.clientHeight + 1, 'Normal registration fields require an inner scrollbar');
                const footer = doc.querySelector('.registration-step-actions').getBoundingClientRect();
                const address = fields.at(-1).getBoundingClientRect();
                assert(footer.top - address.bottom <= 17, 'Unnecessary space remains before the next-step actions');
                assert(doc.documentElement.scrollWidth <= width + 1, 'Registration overflows horizontally');
                if (width > 980) assert(footer.bottom <= height, 'Next-step actions fall below the viewport');
            };
            measure();
            const error = fields[3].querySelector('.registration-field-error');
            error.hidden = false;
            error.textContent = 'Kimlik numarasi 11 haneli olmalidir.';
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            measure();
        });
    }

    for (const width of [1280, 390]) {
        await test(`Commissioning device arrows close and reopen without losing drafts at ${width}px`, async (doc, win, load) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = '850px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + requestCss;
            doc.head.append(style);
            doc.body.innerHTML = commissioningEntry.markup;
            win.HTMLElement.prototype.scrollIntoView = () => {};
            let saves = 0, checks = 0;
            win.fetch = async url => {
                let data;
                if (url.endsWith('/tesisat-sorgula')) {
                    data = { basarili: true, tesistatNo: '10001', sozlesmeNo: '20001', musteriAdi: 'Test Abone', cihazlar: [
                        { cihazTipi: 'Kombi', cihazMarka: 'Test Marka', cihazModeli: 'Kombi modeli', cihazKapasite: '20000', sorguReferansi: 'test-device-1' },
                        { cihazTipi: 'Ocak', cihazMarka: 'Test Marka', cihazModeli: 'Ocak modeli', cihazKapasite: '1500', sorguReferansi: 'test-device-2' }
                    ] };
                } else if (url.endsWith('/marka-kontrol')) {
                    checks++;
                    data = { yetkili: true, markaId: 1, markaAdi: 'Test Marka' };
                } else if (url.endsWith('/kaydet-json')) {
                    saves++;
                    data = { basarili: true, id: 999 };
                } else throw new Error(`Unexpected commissioning request: ${url}`);
                return { ok: true, json: async () => data };
            };
            load('commissioning-entry');
            doc.querySelector('#tesistatNo').value = '10001';
            doc.querySelector('#sozlesmeNo').value = '20001';
            await win.tesistatSorgula();
            await win.cihazSec(0);
            const form = doc.querySelector('#formKart');
            const card = doc.querySelector('.ys-device-work-card');
            const button = card.querySelector('button');
            doc.querySelector('#cihazModeli').value = 'Edited model';
            doc.querySelector('#seriNo').value = 'SERIAL-123';
            doc.querySelector('#notlar').value = 'Saved draft note';
            const expandedHeight = card.getBoundingClientRect().height;
            button.querySelector('i').click();
            assert(button.getAttribute('aria-expanded') === 'false' && !card.classList.contains('is-active'), 'Second arrow click does not collapse the card');
            assert(form.hidden && form.disabled && win.getComputedStyle(card.querySelector('.ys-device-work-body')).display === 'none', 'Collapsed inputs remain visible or enabled');
            assert(card.getBoundingClientRect().height < expandedHeight, 'Collapsed card retains the expanded height');
            assert(doc.querySelector('.ys-commissioning-device-option').getAttribute('aria-pressed') === 'true', 'Collapsing removes the selected device');
            doc.querySelector('#devreyeAlmaForm').dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }));
            assert(saves === 0, 'A hidden device form can still be submitted');
            button.click();
            assert(button.getAttribute('aria-expanded') === 'true' && !form.hidden && !form.disabled, 'Closed card cannot reopen');
            assert(doc.querySelector('#seriNo').value === 'SERIAL-123' && doc.querySelector('#cihazModeli').value === 'Edited model'
                && doc.querySelector('#notlar').value === 'Saved draft note', 'Reopening loses entered fields');
            assert(checks === 1 && saves === 0, 'Toggling unexpectedly calls the API');
            await win.cihazSec(1);
            const secondButton = doc.querySelectorAll('.ys-device-work-toggle')[1];
            secondButton.click();
            doc.querySelector('#seriNo').value = 'SECOND-456';
            secondButton.click();
            button.click();
            assert(doc.querySelector('#seriNo').value === 'SERIAL-123', 'Switching after collapse mixes device drafts');
            secondButton.click();
            assert(doc.querySelector('#seriNo').value === 'SECOND-456'
                && doc.querySelector('#f-sorguReferansi').value === 'test-device-2', 'Reopening the second card loses its draft or source reference');
            assert(doc.querySelectorAll('.ys-device-work-card.is-active').length === 1, 'Multiple device forms remain expanded');
            for (const [selector, value] of [['#teknisyenAdi', 'Test Teknisyen'], ['#teknisyenBelgeNo', 'TEST-123']]) doc.querySelector(selector).value = value;
            doc.querySelector('#devreyeAlmaForm').dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }));
            await until(() => doc.querySelectorAll('.ys-device-work-card')[1].classList.contains('is-completed'));
            secondButton.click();
            assert(secondButton.getAttribute('aria-expanded') === 'true' && form.disabled, 'Completed card cannot open its read-only result');
            secondButton.click();
            assert(secondButton.getAttribute('aria-expanded') === 'false', 'Completed result cannot collapse');
            secondButton.click();
            assert(doc.querySelectorAll('.ys-device-work-card')[1].querySelectorAll('a').length === 1 && saves === 1, 'Completed card duplicates its link or resubmits');
            assert(doc.documentElement.scrollWidth <= width + 1, 'Device cards cause horizontal scrolling');
        });
    }

    for (const width of [1280, 390]) {
        await test(`Commissioning denies unauthorized devices before opening inputs at ${width}px`, async (doc, win, load) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = '850px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + requestCss;
            doc.head.append(style);
            doc.body.innerHTML = commissioningEntry.markup;
            win.HTMLElement.prototype.scrollIntoView = () => {};
            const message = 'Ocak cihaz tipinde işlem yetkiniz yok.';
            const checks = [], errors = [];
            let saves = 0, grantStove = false;
            win.operationToast = { error: text => errors.push(text) };
            win.fetch = async (url, options) => {
                let data;
                if (url.endsWith('/tesisat-sorgula')) {
                    data = { basarili: true, tesistatNo: '10001', sozlesmeNo: '20001', musteriAdi: 'Test Abone', cihazlar: [
                        { cihazTipi: 'Ocak', cihazMarka: 'Test Marka', sorguReferansi: 'stove-source' },
                        { cihazTipi: 'Kombi', cihazMarka: 'Test Marka', sorguReferansi: 'boiler-source' }
                    ] };
                } else if (url.endsWith('/marka-kontrol')) {
                    const payload = JSON.parse(options.body);
                    checks.push(payload);
                    data = payload.sorguReferansi === 'stove-source' && !grantStove
                        ? { yetkili: false, mesaj: message }
                        : { yetkili: true, markaId: 1, markaAdi: 'Test Marka' };
                } else if (url.endsWith('/kaydet-json')) {
                    saves++;
                    data = { basarili: true, id: 999 };
                } else throw new Error(`Unexpected commissioning request: ${url}`);
                return { ok: true, json: async () => data };
            };
            load('commissioning-entry');
            doc.querySelector('#tesistatNo').value = '10001';
            doc.querySelector('#sozlesmeNo').value = '20001';
            await win.tesistatSorgula();
            await win.cihazSec(0);
            const form = doc.querySelector('#formKart');
            const pending = doc.querySelector('#ysDevicePending');
            assert(form.hidden && form.disabled && !doc.querySelector('.ys-device-work-card'), 'Unauthorized device opens editable fields');
            assert(!pending.hidden && pending.classList.contains('is-warning') && pending.textContent.includes(message), 'Category denial is not visible at selection');
            assert(doc.querySelector('.ys-commissioning-device-option').classList.contains('is-unavailable'), 'Denied device is not marked');
            assert(checks[0].sorguReferansi === 'stove-source' && !('cihazMarka' in checks[0]), 'Permission check does not use the source reference');
            doc.querySelector('#devreyeAlmaForm').dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }));
            assert(saves === 0, 'Denied device can still submit');
            await win.cihazSec(1);
            assert(!form.hidden && !form.disabled && doc.querySelector('#cihazTipi').value === 'Kombi', 'An allowed device cannot be entered');
            doc.querySelector('#seriNo').value = 'KEEP-DRAFT';
            await win.cihazSec(0);
            assert(errors.includes(message) && doc.querySelectorAll('.ys-device-work-card').length === 1, 'Denial beside an existing draft is missing or creates a card');
            assert(doc.querySelector('#seriNo').value === 'KEEP-DRAFT' && doc.querySelector('#f-sorguReferansi').value === 'boiler-source', 'Denied selection corrupts another device draft');
            grantStove = true;
            await win.cihazSec(0);
            assert(doc.querySelectorAll('.ys-device-work-card').length === 2, 'Permission cannot be rechecked after it is granted');
            assert(doc.documentElement.scrollWidth <= width + 1, 'Permission warning causes horizontal scrolling');
        });
    }

    for (const width of [320, 760, 1000, 1440]) {
        await test(`Firm failure summary stays compact and expands without clipping at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = '720px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + reportCss;
            doc.head.append(style);
            const reason = 'Baca bağlantısı ve cihaz montajındaki uygunsuzluk giderilmelidir. '.repeat(20);
            doc.body.innerHTML = `<div class="ykc-detail-page"><section class="ykc-firm-record"><section class="ykc-firm-control-status">
                <i class="bi bi-calendar2-check" aria-hidden="true"></i><div><h2>Kontrol randevusu planlanacak</h2>
                <p class="ykc-firm-last-control">Son kontrol: <strong>Uygun değil</strong></p>
                <details class="ykc-firm-reason"><summary><span><b>Uygunsuzluk gerekçesi:</b> ${reason.slice(0,160)}…</span><span class="ykc-reason-more">Devamını göster</span><span class="ykc-reason-less">Kısalt</span></summary><p>${reason}</p></details></div>
                <time><span>Kontrol Randevusu</span><strong>10.10.2026 <b>09:00</b></strong></time></section></section></div>`;
            await doc.fonts.ready;
            const surface = doc.querySelector('.ykc-firm-control-status');
            const details = doc.querySelector('details');
            const height = surface.getBoundingClientRect().height;
            assert(height <= (width < 760 ? 225 : 170), `Collapsed explanation inflates the status area: ${height}`);
            assert(doc.documentElement.scrollWidth <= width + 1, 'Failure reason causes horizontal scrolling');
            details.querySelector('summary').click();
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            assert(details.open && details.querySelector('p').textContent === reason, 'Expanded reason loses content');
            assert(win.getComputedStyle(details.querySelector('.ykc-reason-more')).display === 'none', 'Expand label remains after opening');
            const paragraph = details.querySelector('p');
            assert(paragraph.scrollHeight <= paragraph.clientHeight + 1 && doc.documentElement.scrollWidth <= width + 1,
                'Full reason clips or creates an inner scrollbar');
            details.querySelector('summary').click();
            assert(Math.abs(surface.getBoundingClientRect().height - height) < 1, 'Collapsing does not restore the compact layout');
        });
    }

    for (const width of [390, 760, 1000, 1440]) {
        await test(`Pending work keeps three existing quick-action rows at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = '720px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + homeCalendarCss;
            doc.head.append(style);
            const labels = ['İnceleme bekleyen talepler', 'Randevu planlanacak talepler', 'Tamamlama bekleyen talepler'];
            doc.body.innerHTML = `<div class="role-dashboard role-dashboard--personnel"><section class="personnel-work-queue"><header><h2>Hızlı İşlemler</h2><span>Güncel durum</span></header>
                <div class="personnel-work-queue__list" style="--personnel-row-count:3">${labels.map(title => `<a class="personnel-work-row" href="#"><span class="personnel-work-row__icon"></span><strong class="personnel-work-row__title">${title}</strong><span class="personnel-work-row__metric"><strong>123</strong><small>talep</small></span><span class="personnel-work-row__actions"></span></a>`).join('')}</div></section></div>`;
            await doc.fonts.ready;
            const rows = [...doc.querySelectorAll('.personnel-work-row')];
            assert(rows.length === 3 && doc.documentElement.scrollWidth <= width + 1, 'Quick actions add rows or horizontal scrolling');
            for (const row of rows) {
                const title = row.querySelector('strong');
                assert(title.scrollWidth <= title.clientWidth + 1 && title.scrollHeight <= title.clientHeight + 1,
                    'Pending action title is clipped');
                const titleRect = title.getBoundingClientRect();
                const metricRect = row.querySelector('.personnel-work-row__metric').getBoundingClientRect();
                const actionsRect = row.querySelector('.personnel-work-row__actions').getBoundingClientRect();
                assert(titleRect.right <= metricRect.left && metricRect.right <= actionsRect.left,
                    'Removing the category overlaps the title, counter or actions');
                assert(Math.abs(titleRect.top + titleRect.height / 2 - metricRect.top - metricRect.height / 2) < 3,
                    'Removing the category misaligns the title and counter');
                if (width > 600) assert(win.getComputedStyle(title).gridColumn === '2 / 4', 'Title does not use the removed category space');
            }
        });
    }

    function branchForm(admin, edit = false) {
        return `<form class="ys-branch-editor" method="post" action="/${admin ? 'AdminPanel' : 'ys-panel'}/subeler/${edit ? 'duzenle/8' : 'ekle'}">

    function warningClock(win) {
        const nativeSetTimeout = win.setTimeout.bind(win), nativeClearTimeout = win.clearTimeout.bind(win);
        const timers = new Map();
        let now = 0, nextId = -1;
        win.setTimeout = (callback, delay, ...args) => {
            if (delay < 12000) return nativeSetTimeout(callback, delay, ...args);
            const id = nextId--;
            timers.set(id, { due: now + delay, callback: () => callback(...args) });
            return id;
        };
        win.clearTimeout = id => { if (!timers.delete(id)) nativeClearTimeout(id); };
        return { advance(ms) {
            now += ms;
            for (const [id, timer] of timers) {
                if (timer.due <= now) { timers.delete(id); timer.callback(); }
            }
        }, get count() { return timers.size; } };
    }

            sections[0].querySelector('.wide dd').textContent = 'Uzun mahalle, cadde ve bina adresi '.repeat(12);
            sections[2].querySelector('dd').textContent = 'Uzun firma adı '.repeat(8);
            assertAlignment();
            const controls = doc.createElement('section');
            controls.className = 'ykc-firm-data-section';
            controls.textContent = 'Kontrol sonuçları';
            doc.querySelector('.ykc-firm-record-data').append(controls);
            const finalDocument = doc.createElement('section');
            finalDocument.className = 'ykc-firm-data-section';
            finalDocument.textContent = 'Sonuç belgesi';
            history.before(finalDocument);
            assertAlignment();
            history.querySelector('summary').click();
            assertAlignment();
        });
    }
    for (const width of [1280, 900, 390]) {
        for (const state of ['pending', 'approved', 'rejected']) {
            await test(`Approval ${state} details use balanced space without extra height at ${width}px`, async (doc, win) => {
                win.frameElement.style.width = `${width}px`;
                const style = doc.createElement('style');
                style.textContent = panelCss + operationsCss;
                doc.head.append(style);
                doc.body.innerHTML = `<main class="df-approval-workspace"><div class="df-approval-table-wrap"><div class="df-approval-detail-grid">
                    <div><span>Vergi No</span><strong>1919191960</strong></div>
                    <div><span>Yetkili Kisi</span><strong>Yigit Ahlat</strong></div>
                    <div><span>Telefon</span><strong>05530139628</strong></div>
                    <div><span>Il</span><strong>Corum</strong></div>
                    <div class="is-valid"><span>Bitis Durumu</span><strong>53 gun kaldi</strong></div>
                    <div class="is-wide"><span>Firma Adresi</span><strong>Bahcelievler mah. Bahabey Sokak. Ahlatci Plaza</strong></div>
                    ${state !== 'pending' ? '<div><span>Karar Tarihi</span><strong>05.10.2026 10:30</strong></div>' : ''}
                    ${state === 'rejected' ? '<div class="is-wide"><span>Red Gerekcesi</span><strong>Belge tarih araligi ile firma bilgileri uyusmuyor.</strong></div>' : ''}
                    </div></div></main>`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const grid = doc.querySelector('.df-approval-detail-grid');
                const fields = [...grid.children];
                const text = grid.textContent;
                const height = grid.getBoundingClientRect().height;
                const boxes = fields.map(field => field.getBoundingClientRect());
                assert(fields.every(field => field.scrollWidth <= field.clientWidth + 1), 'Detail text overflows');
                if (width > 760 && state === 'pending') {
                    assert(boxes.slice(0, 5).every(box => Math.abs(box.top - boxes[0].top) < 1), 'Short facts do not share one five-column row');
                    assert(Math.abs(boxes[5].left - boxes[0].left) < 1 && Math.abs(boxes[5].right - boxes[4].right) < 1, 'Address does not span the full detail width');
                    const addressLabel = fields[5].querySelector('span').getBoundingClientRect();
                    const addressValue = fields[5].querySelector('strong').getBoundingClientRect();
                    assert(addressValue.left >= addressLabel.right && Math.abs(addressValue.top - addressLabel.top) < 4, 'Address label and value are not on the same compact line');
                }
                const baseline = doc.createElement('style');
                baseline.textContent = `.df-approval-detail-grid { grid-template-columns:repeat(${width > 760 ? 4 : 2},minmax(0,1fr))!important; }
                    .df-approval-detail-grid > div { grid-area:auto!important; }
                    .df-approval-detail-grid > div.is-wide { grid-column:${width > 760 ? 'span 2' : '1 / -1'}!important; }`;
                doc.head.append(baseline);
                assert(height <= grid.getBoundingClientRect().height + 1, 'New layout increases detail height');
                baseline.remove();
                assert(grid.textContent === text, 'Details were added or removed');
            });
        }
    }
    document.querySelector('#summary').textContent = `${passed} passed, ${failed} failed`;
</script>
</html>
