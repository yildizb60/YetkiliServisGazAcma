<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Browser Form Regression Tests</title>
<h1>Browser Form Regression Tests</h1>
<output id="summary">Running</output>
<ol id="results"></ol>
<script type="module">
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const scripts = Object.fromEntries(await Promise.all(['toast', 'drawer', 'permission', 'appointment', 'report', 'dropdown', 'commissioning'].map(async name =>
        [name, await (await fetch(`/${name}.js`)).text()])));
    const reportCss = await (await fetch('/report.css')).text();
    const panelCss = (await Promise.all(['panel-layout', 'panel-unify'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const operationsCss = await (await fetch('/operations-directory.css')).text();
    const serviceEditorCss = await (await fetch('/service-editor.css')).text();
    const limits = await (await fetch('/appointment-limits.json')).json();
    let passed = 0, failed = 0;

    async function test(name, run) {
        const frame = document.createElement('iframe');
        frame.title = name;
        document.body.append(frame);
        const win = frame.contentWindow, doc = win.document;
        const errors = [];
        win.addEventListener('error', event => errors.push(event.message));
        win.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
        const load = name => {
            const script = doc.createElement('script');
            script.textContent = scripts[name];
            doc.body.append(script);
        };
        try {
            await run(doc, win, load);
            assert(!errors.length, errors.join('; '));
            passed++;
            document.querySelector('#results').insertAdjacentHTML('beforeend', `<li>PASS: ${name}</li>`);
        } catch (error) {
            failed++;
            const item = document.createElement('li');
            item.textContent = `FAIL: ${name}: ${error.message}`;
            document.querySelector('#results').append(item);
        } finally {
            frame.remove();
        }
    }

    for (const context of ['admin-page', 'admin-drawer', 'personnel']) {
        for (const width of [750, 375]) {
            await test(`Service ${context} keeps labels next to controls with supporting text at ${width}px`, async (doc, win) => {
                win.frameElement.style.width = `${width}px`;
                const style = doc.createElement('style');
                style.textContent = panelCss + '\n' + operationsCss + '\n' + serviceEditorCss;
                doc.head.append(style);
                const personnel = context === 'personnel';
                const field = personnel ? 'service-field' : 'df-admin-field';
                const fields = `<div class="${field} ${personnel ? 'service-field--span-2' : ''}"><label for="name">Firma Adi</label><input id="name" value="Corum Yetkili Servis"></div>
                    <div class="${field}"><label for="contact">Yetkili Kisi</label><input id="contact" value="Corum Yetkili Servis"></div>
                    <div class="${field}"><label for="phone">Telefon</label><input id="phone" value="03645555555"></div>
                    <div class="${field}"><label for="email">E-posta</label><input id="email" value="service@example.com"></div>
                    <div class="${field}"><label for="city">Sehir</label><select id="city"><option>Corum</option></select>
                        <div class="firma-kodu-hint is-visible">Bagli firma kodu: CORUMGAZ</div></div>
                    <div class="${field}"><label for="tax">Vergi No</label><input id="tax" value="7444444444"></div>`;
                doc.body.innerHTML = personnel
                    ? `<div class="service-editor"><div class="service-editor-fields">${fields}</div></div>`
                    : context === 'admin-drawer'
                        ? `<div class="df-directory-sheet df-admin-service-sheet is-visible"><form class="df-admin-service-editor-form"><div class="df-admin-form-grid">${fields}</div></form></div>`
                        : `<div class="df-admin-editor df-management-form"><div class="df-admin-form-grid">${fields}</div></div>`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const controls = [...doc.querySelectorAll('input, select')];
                const expectedGap = Number.parseFloat(win.getComputedStyle(controls[0].parentElement).rowGap);
                for (const control of controls) {
                    const label = control.previousElementSibling;
                    const gap = control.getBoundingClientRect().top - label.getBoundingClientRect().bottom;
                    assert(Math.abs(gap - expectedGap) < 1, `Supporting text stretches label spacing for ${control.id}: ${gap}px`);
                }
                const before = controls.map(control => control.getBoundingClientRect().top);
                doc.querySelector('.firma-kodu-hint').textContent = 'Additional supporting text '.repeat(8);
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                for (let index = 0; index < 5; index++) {
                    const control = controls[index], label = control.previousElementSibling;
                    const gap = control.getBoundingClientRect().top - label.getBoundingClientRect().bottom;
                    assert(Math.abs(gap - expectedGap) < 1, `Long supporting text separates ${control.id} from its label`);
                    if (width === 750) assert(Math.abs(control.getBoundingClientRect().top - before[index]) < 1, 'Supporting text shifts neighboring controls');
                }
                assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Service form overflows');
            });
        }
    }

    function confirmationFixture(doc, win, load) {
        doc.body.innerHTML = `<main><form data-toast-confirm action="/default" method="post">
            <input name="note" required value="ready">
            <button type="submit" name="islem" value="onayla">Approve</button>
            <button type="submit" name="islem" value="reddet" formaction="/reject" formmethod="get">Reject</button>
            </form></main><div data-operation-toast-stack></div>`;
        load('toast');
        const form = doc.querySelector('form'), submissions = [];
        doc.addEventListener('submit', event => {
            if (event.defaultPrevented) return;
            event.preventDefault();
            submissions.push({
                button: event.submitter,
                operation: new win.FormData(form, event.submitter).get('islem'),
                action: event.submitter?.getAttribute('formaction') || form.getAttribute('action'),
                method: event.submitter?.getAttribute('formmethod') || form.method
            });
        });
        const confirm = () => doc.querySelector('.is-confirm:not(.is-leaving) .is-confirm-action').click();
        return { form, submissions, confirm };
    }

    for (const operation of ['onayla', 'reddet']) {
        await test(`Confirmation preserves ${operation} submitter and overrides`, (doc, win, load) => {
            const { form, submissions, confirm } = confirmationFixture(doc, win, load);
            const button = form.querySelector(`[value="${operation}"]`);
            button.click();
            assert(!submissions.length, 'Submitted before confirmation');
            confirm();
            assert(submissions.length === 1 && submissions[0].button === button, 'Submitter lost');
            assert(submissions[0].operation === operation, 'Button name/value lost');
            assert(submissions[0].action === (operation === 'reddet' ? '/reject' : '/default'), 'Action lost');
            assert(submissions[0].method === (operation === 'reddet' ? 'get' : 'post'), 'Method lost');
            assert(!form.dataset.toastConfirmed, 'Confirmation token left behind');
        });
    }
    await test('Confirmation without a submit button still submits once', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        form.requestSubmit();
        confirm();
        assert(submissions.length === 1 && submissions[0].button === null, 'Unexpected submitter');
    });
    await test('Cancel does not submit and restores focus', (doc, win, load) => {
        const { form, submissions } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button');
        button.click();
        doc.querySelector('.is-cancel').click();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Cancelled form submitted');
        assert(doc.activeElement === button && !doc.querySelector('main').inert, 'Focus not restored');
    });
    await test('Failed native validation requires a fresh confirmation', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button'), input = form.querySelector('input');
        button.click();
        input.value = '';
        confirm();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Invalid form retained confirmation');
        input.value = 'corrected';
        button.click();
        assert(!submissions.length && doc.querySelector('.is-confirm:not(.is-leaving)'), 'Confirmation bypassed');
        confirm();
        assert(submissions.length === 1, 'Corrected form did not submit');
    });
    await test('Removed submitter cannot send a different operation', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button');
        button.click();
        button.remove();
        confirm();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Detached button submitted');
    });

    const permissions = `<section class="permission-editor"><div class="permission-editor-body"><form>
        <select data-permission-company-select><option value="1">One</option><option value="2">Two</option></select>
        ${[1, 2].map(id => `<details class="company-permission" data-permission-company="${id}" open>
            <summary>Company ${id}<span class="company-permission-state"></span>
            <input type="checkbox" class="company-enable" name="sirketIds" value="${id}" checked></summary>
            <input type="checkbox" class="permission-option" name="yetkiler_${id}" value="RAPOR_GOR" checked>
            </details>`).join('')}</form></div></section>`;

    for (const surface of ['page', 'drawer']) {
        await test(`Company switching preserves selections in ${surface}`, async (doc, win, load) => {
            if (surface === 'page') {
                doc.body.innerHTML = permissions;
                load('permission');
            } else {
                doc.body.innerHTML = `<button class="js-admin-form-sheet-trigger" data-sheet-url="/fixture" data-sheet-variant="permission">Open</button>
                    <dialog data-admin-form-sheet><h2 data-admin-form-sheet-title></h2>
                    <button data-admin-form-sheet-close>Close</button><div data-admin-form-sheet-body></div></dialog>`;
                // The drawer loads only this synthetic form, never application records.
                win.fetch = async () => ({ ok: true, text: async () => permissions });
                load('drawer');
                doc.querySelector('.js-admin-form-sheet-trigger').click();
                await new Promise(resolve => win.setTimeout(resolve, 0));
            }
            const companies = [...doc.querySelectorAll('[data-permission-company]')];
            const select = doc.querySelector('select');
            for (const selected of ['1', '2', '1']) {
                select.value = selected;
                select.dispatchEvent(new win.Event('change'));
                for (const company of companies) {
                    const current = company.dataset.permissionCompany === selected;
                    assert(company.open === current && company.hidden === !current, 'Wrong panel state');
                    assert(company.classList.contains('is-current') === current, 'Wrong current class');
                }
                const data = new win.FormData(select.form);
                assert(data.get('yetkiler_1') === 'RAPOR_GOR' && data.get('yetkiler_2') === 'RAPOR_GOR', 'Hidden company lost permissions');
            }
        });
    }

    for (const [value, allowed, message] of [
        ['08:00', true, ''], ['17:30', true, ''],
        ['07:30', false, '08.00 ile 17.30'], ['17:45', false, '08.00 ile 17.30'],
        ['18:00', false, '08.00 ile 17.30'], ['08:15', false, '00 veya 30']
    ]) {
        await test(`Appointment ${value}: ${allowed ? 'accepted' : 'rejected'}`, (doc, win, load) => {
            doc.body.innerHTML = `<form data-appointment-form><input id="randevuTarihi" type="date" value="2099-01-01">
                <input id="randevuSaati" type="time" min="${limits.min}" max="${limits.max}" step="${limits.step}" required></form>`;
            load('appointment');
            const form = doc.querySelector('form'), time = doc.querySelector('#randevuSaati');
            let submitted = false;
            form.addEventListener('submit', event => { submitted = !event.defaultPrevented; event.preventDefault(); });
            time.value = value;
            // requestSubmit also tests native invalid-event handling without an input event.
            form.requestSubmit();
            assert(submitted === allowed, 'Wrong submission result');
            assert(time.validationMessage.includes(message), 'Wrong validation message: ' + time.validationMessage);
            time.value = '17:30';
            time.dispatchEvent(new win.Event('input'));
            assert(time.validity.valid && !time.validationMessage, 'Error persisted after correction');
        });
    }
    await test('Report device fields stay aligned with wrapping and model text after resizing', async (doc, win, load) => {
        const style = doc.createElement('style');
        style.textContent = reportCss;
        doc.head.append(style);
        win.frameElement.style.width = '1536px';
        const headings = ['Select', 'ID', 'Customer', 'Installation', 'Company', 'Type', 'Project', 'New', 'Team', 'Status', 'Detail'];
        const devices = `<td class="ykc-report-project-cell" data-label="Project"><div class="ykc-device-column is-project">
            <strong data-device-field="brand">Long project device brand with multiple words</strong>
            <small data-device-field="capacity">Capacity: 21070</small><small data-device-field="flue">Flue: -</small></div></td>
            <td class="ykc-report-new-cell" data-label="New"><div class="ykc-device-column is-new">
            <strong data-device-field="brand">Brand</strong>
            <small data-device-field="capacity">Capacity: 2600 with a longer source unit description</small>
            <small data-device-field="flue">Flue: A long description that must remain fully visible</small>
            <small>Model: Additional model information remains below the shared fields</small></div></td>`;
        doc.body.innerHTML = `<main class="ykc-report-page ykc-results"><div class="ykc-table-scroll" style="width:1400px">
            <table class="ykc-report-table is-internal"><thead><tr>${headings.map(text => `<th>${text}</th>`).join('')}</tr></thead>
            <tbody><tr>${'<td></td>'.repeat(6)}${devices}${'<td></td>'.repeat(3)}</tr></tbody></table></div></main>`;
        load('report');
        const container = doc.querySelector('.ykc-table-scroll');
        const fields = [...doc.querySelectorAll('[data-device-field]')];
        const originalTexts = fields.map(field => field.textContent);
        let initialHeights;
        for (const width of [1400, 960, 330, 1400]) {
            container.style.width = `${width}px`;
            for (let frame = 0; frame < 3; frame++) {
                await new Promise(resolve => win.requestAnimationFrame(resolve));
            }
            for (const name of ['brand', 'capacity', 'flue']) {
                const pair = [...doc.querySelectorAll(`[data-device-field="${name}"]`)];
                assert(Math.abs(pair[0].getBoundingClientRect().top - pair[1].getBoundingClientRect().top) < 1,
                    `${name} is misaligned at ${width}px`);
            }
            assert(fields.every((field, index) => field.textContent === originalTexts[index]), 'Device information changed');
            assert(fields.every(field => field.scrollWidth <= field.clientWidth + 1), 'Device text overflows');
            const model = doc.querySelector('.is-new small:last-child');
            assert(model.getBoundingClientRect().top >= doc.querySelector('.is-new [data-device-field="flue"]').getBoundingClientRect().bottom,
                'Model displaced a shared field');
            if (width === 1400) {
                const heights = fields.map(field => field.getBoundingClientRect().height);
                if (initialHeights) assert(heights.every((height, index) => Math.abs(height - initialHeights[index]) < 1), 'Resizing accumulated empty space');
                initialHeights = heights;
            }
        }
    });
    for (const role of ['internal', 'firm']) {
        await test(`Report ${role} keeps desktop column headers and single-row records`, async (doc, win) => {
            const style = doc.createElement('style');
            style.textContent = reportCss;
            doc.head.append(style);
            win.frameElement.style.width = '1536px';
            const columns = [
                ['select', 'Se&#231;', '<input type="checkbox">'],
                ['record', 'Talep No', '<span class="ykc-code">#67</span>'],
                ['customer', 'Abone &#304;smi', '<div class="ykc-report-customer">Multi Word Customer Name</div>'],
                ['installation', 'Tesisat ve S&#246;zle&#351;me Bilgileri', '<dl class="ykc-id-list"><div><dt>Tesisat No:</dt><dd>1081196</dd></div><div><dt>S&#246;zle&#351;me No:</dt><dd>133178</dd></div></dl>'],
                ...(role === 'internal' ? [['company', 'Firma', 'Demo Sertifikal&#305; Firma']] : []),
                ['type', 'Yak&#305;c&#305; Cihaz Tipi', '<span class="ykc-device-type">Kombi</span>'],
                ...(role === 'internal' ? [['project', 'Projedeki Cihaz', '<div class="ykc-device-column is-project"><strong>Brand</strong><small>Kapasite: 20000</small><small>Baca tipi: -</small></div>']] : []),
                ['new', 'Yeni Kullan&#305;lan Cihaz', '<div class="ykc-device-column is-new"><strong>Brand</strong><small>Kapasite: 2600</small><small>Baca tipi: Hermetik</small></div>'],
                ...(role === 'internal' ? [['team', 'Ekip', 'M&#252;hendis']] : []),
                ['status', 'Talep / &#304;mza Durumu', 'Tamamland&#305;'],
                ['detail', 'Detay', '<button class="ykc-detail-action" aria-label="Details"><i class="bi bi-eye"></i></button>']
            ];
            doc.body.innerHTML = `<main class="ykc-report-page ykc-results"><div class="ykc-table-scroll" style="width:1400px">
                <table class="ykc-report-table is-${role}"><thead><tr>${columns.map(([name, label]) => `<th class="ykc-report-${name}-cell ${name === 'type' ? 'ykc-device-type-heading' : ''}">${label}</th>`).join('')}</tr></thead>
                <tbody><tr>${columns.map(([name, label, content]) => `<td class="ykc-report-${name}-cell" data-label="${label}">${content}</td>`).join('')}</tr></tbody></table></div></main>`;
            const container = doc.querySelector('.ykc-table-scroll');
            const row = doc.querySelector('tbody tr');
            for (const width of [1400, 1160, 960, 760, 330]) {
                container.style.width = `${width}px`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const right = container.getBoundingClientRect().right;
                const overflowing = [...container.querySelectorAll('*')].filter(element => element.getBoundingClientRect().right > right + 1 || element.scrollWidth > element.clientWidth + 1)
                    .map(element => `${element.tagName}.${element.className}: width ${element.clientWidth}, scroll ${element.scrollWidth}`);
                assert(container.scrollWidth <= container.clientWidth + 1, `Horizontal overflow at ${width}px: ${overflowing.join(', ')}`);
                assert([...doc.querySelectorAll('.ykc-id-list dd')].every(number => number.scrollWidth <= number.clientWidth + 1),
                    `Installation numbers overflow at ${width}px`);
                if (width > 740) {
                    const typeHeading = doc.querySelector('.ykc-device-type-heading');
                    assert(win.getComputedStyle(typeHeading).whiteSpace === 'nowrap' && typeHeading.scrollWidth <= typeHeading.clientWidth + 1,
                        `Device type heading does not fit on one line at ${width}px`);
                    assert(doc.querySelector('thead tr').getBoundingClientRect().height <= (width < 960 ? 49 : 40),
                        `Header is unnecessarily tall at ${width}px: ${[...doc.querySelectorAll('th')].map(x => `${x.textContent}: ${x.clientWidth}x${x.clientHeight}`).join(', ')}`);
                    assert(win.getComputedStyle(row).display === 'table-row', `Desktop record was split at ${width}px`);
                    assert(win.getComputedStyle(doc.querySelector('thead')).position !== 'absolute', `Column headers were hidden at ${width}px`);
                    const top = row.cells[0].getBoundingClientRect().top;
                    assert([...row.cells].every(cell => Math.abs(cell.getBoundingClientRect().top - top) < 1),
                        `Columns are not on the same row at ${width}px`);
                } else {
                    assert(win.getComputedStyle(row).display === 'grid', 'Small-screen layout was lost');
                }
            }
        });
    }
    for (const role of ['internal', 'firm']) {
        await test(`Request ${role} separates company and contract information without overlapping`, async (doc, win) => {
            win.frameElement.style.width = '1536px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + reportCss;
            doc.head.append(style);
            const internal = role === 'internal';
            const widths = internal ? [7,9,9,14.5,12,12.25,2,12.25,10.5,11.5] : [9,16,18,13,17,12,15];
            const columns = ['<td>#67</td><td>Multi Word Customer</td>',
                internal ? '<td class="ykc-list-company-cell"><div>Demo Certified Company</div></td>' : '',
                '<td class="ykc-list-installation-cell"><dl class="ykc-id-list"><div><dt>Tesisat No:</dt><dd>1081196</dd></div><div><dt>S&#246;zle&#351;me No:</dt><dd>133178</dd></div></dl></td>',
                '<td><span class="ykc-device-type">Kombi</span></td>', internal ? '<td>Project device</td><td></td>' : '',
                '<td>New device</td><td>Appointment</td><td>Status</td>'].join('');
            const headings = ['<th>ID</th><th>Customer</th>', internal ? '<th class="ykc-list-company-cell">Company</th>' : '',
                '<th class="ykc-list-installation-cell">Tesisat ve S&#246;zle&#351;me Bilgileri</th><th class="ykc-device-type-heading">Yak&#305;c&#305; Cihaz Tipi</th>',
                internal ? '<th>Project</th><th></th>' : '', '<th>New</th><th>Appointment</th><th>Status</th>'].join('');
            doc.body.innerHTML = `<main class="ykc-list-page"><div class="ykc-table-scroll"><table class="ykc-data-table is-${role}">
                <colgroup>${widths.map(width => `<col style="width:${width}%">`).join('')}</colgroup><thead><tr>${headings}</tr></thead>
                <tbody><tr>${columns}</tr></tbody></table></div></main>`;
            for (const width of [1400, 980]) {
                doc.querySelector('main').style.width = `${width}px`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const cell = doc.querySelector('td.ykc-list-installation-cell');
                assert([...cell.querySelectorAll('dd')].every(value => value.getBoundingClientRect().right <= cell.getBoundingClientRect().right - 5), 'Contract numbers spill into another column');
                if (internal) {
                    const company = doc.querySelector('td.ykc-list-company-cell');
                    assert(cell.querySelector('dl').getBoundingClientRect().left - company.firstElementChild.getBoundingClientRect().right >= 25, 'Company and installation data are too close');
                }
                const typeHeading = doc.querySelector('.ykc-device-type-heading');
                assert(win.getComputedStyle(typeHeading).whiteSpace === 'nowrap' && typeHeading.scrollWidth <= typeHeading.clientWidth + 1, 'Device type heading wraps or overflows');
            }
        });
    }
    for (const width of [1280, 375]) {
        await test(`Commissioning details keep compact columns and visible labels at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + operationsCss;
            doc.head.append(style);
            doc.body.innerHTML = `<div class="df-admin-table-scroll" style="width:100%;overflow:auto"><table class="df-commissioning-table" style="width:100%"><tbody>
                <tr class="df-commissioning-detail-row"><td colspan="2"><div class="df-commissioning-detail-panel"><div class="df-commissioning-detail-grid">
                <section><span>Subscriber address</span><p>Long full customer address</p></section>
                <section><span>Device</span><dl class="df-commissioning-extra-facts"><div><dt>Model:</dt><dd>Vaillant eloBLOCK VE 9 kW electric heating device with a full model description</dd></div><div><dt>Serial:</dt><dd>77777</dd></div><div><dt>Capacity:</dt><dd>7740</dd></div></dl></section>
                <section><span>Operation</span><dl class="df-commissioning-extra-facts"><div><dt>Service city / district:</dt><dd>Corum / Merkez</dd></div><div><dt>Technician:</dt><dd>Cem Yilmaz</dd></div><div><dt>Technician authorization certificate number:</dt><dd>0000</dd></div></dl></section>
                </div></div></td></tr></tbody></table></div>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            const groups = [...doc.querySelectorAll('section')];
            if (width >= 1050) {
                assert(groups.every(group => Math.abs(group.getBoundingClientRect().top - groups[0].getBoundingClientRect().top) < 1), 'Desktop detail groups are no longer side by side');
                assert(doc.querySelector('.df-commissioning-detail-grid').getBoundingClientRect().height < 140, 'Desktop details retain unnecessary height');
            } else {
                assert(groups.every((group, index) => !index || group.getBoundingClientRect().top >= groups[index-1].getBoundingClientRect().bottom - 1), 'Mobile detail groups overlap');
            }
            assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Detail panel overflows');
            assert([...doc.querySelectorAll('dd')].every(value => value.scrollWidth <= value.clientWidth + 1), 'Detail values are clipped');
            assert([...doc.querySelectorAll('.df-commissioning-detail-grid p, .df-commissioning-extra-facts dd')].every(value => {
                const computed = win.getComputedStyle(value);
                return computed.fontWeight === '400' && computed.color === 'rgb(64, 86, 106)';
            }), 'Routine detail values must remain regular-weight, muted blue text');
            assert(groups.every(group => win.getComputedStyle(group.firstElementChild).fontWeight === '600'), 'Detail headings must be distinct without heavy bold');
            assert([...doc.querySelectorAll('dt')].every(label => label.textContent.endsWith(':')), 'Detail labels have no colon');
            const certificateValue = doc.querySelector('section:last-child dd:last-child');
            assert(certificateValue.getBoundingClientRect().width >= 35, 'Long labels squeeze the certificate number');

    await test('Report selection actions appear only for selected records and both select-all controls stay synchronized', async (doc, win, load) => {

    for (const width of [1280, 375]) {

                <div class="df-dropdown"><button data-dropdown-toggle aria-expanded="false" id="companyBtn">Companies</button>

                ${[1, 2, 3].map(id => `<form class="df-company-form"><input type="hidden" name="sirketId" value="${id}">
                <input type="hidden" name="returnUrl" value="/ykc/raporlar?sayfa=2">
                <button class="df-nb-account-item ${id === 1 ? 'active' : ''}" type="submit">

                ${id === 1 ? '<span class="df-nb-account-sub">Active company</span>' : ''}</span></button></form>`).join('')}
                </div></div></div><div class="df-dropdown"><button data-dropdown-toggle aria-expanded="false">Notifications</button>
                <div class="df-dropdown-menu df-nb-dropdown-wide df-notif-menu">Notifications</div></div></div></header>`;
            load('dropdown');
            const button = doc.querySelector('#companyBtn'), menu = doc.querySelector('#companyMenu');
            button.click();

            const rect = menu.getBoundingClientRect(), list = menu.querySelector('.df-nb-account-list');
            assert(rect.left >= 0 && rect.right <= win.innerWidth + 1, 'Menu is clipped by viewport');
            assert(list.scrollHeight <= list.clientHeight + 1 && win.getComputedStyle(list).overflowY === 'visible', 'Company list scrolls');
            let selection;
            menu.addEventListener('submit', event => {
                event.preventDefault();
                selection = new win.FormData(event.target);
            });
            menu.querySelectorAll('.df-nb-account-item')[1].click();
            assert(selection.get('sirketId') === '2' && selection.get('returnUrl') === '/ykc/raporlar?sayfa=2', 'Company selection payload changed');
            doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            assert(!menu.classList.contains('open') && button.getAttribute('aria-expanded') === 'false' && doc.activeElement === button, 'Escape does not close and restore focus');
            button.click();
            doc.body.click();
            assert(!menu.classList.contains('open'), 'Outside click does not close menu');
            button.click();
            doc.querySelector('.df-dropdown:last-child > button').click();
            const notification = doc.querySelector('.df-notif-menu').getBoundingClientRect();
            assert(!menu.classList.contains('open') && notification.left >= 0 && notification.right <= win.innerWidth + 1, 'Notification menu overlaps or overflows');
        });
    }
    for (const role of ['personnel', 'admin', 'service']) {
        await test(`Commissioning ${role} separates device facts from dates without changing row height or total column width`, async (doc, win) => {
            win.frameElement.style.width = '1536px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + operationsCss;
            doc.head.append(style);
            const firm = role === 'service';
            const columns = [
                ...(!firm ? [['Select', '<input type="checkbox">']] : []),
                ['Customer', '<div class="df-cell-main">CUSTOMER NAME</div>'],
                ['Installation', '<dl class="df-operation-id-list"><div><dt>Installation:</dt><dd>1000378</dd></div><div><dt>Subscriber:</dt><dd>24727749844</dd></div></dl>'],
                ...(!firm ? [['Service', '<div class="df-cell-value">Demo Service</div>']] : []),
                ['Device Type', '<span class="df-device-type-tag">Kombi</span>'],
                ['Commissioned Device', '<dl class="df-device-facts"><div><dt>Brand:</dt><dd>Vaillant</dd></div><div class="df-device-model"><dt>Model:</dt><dd>Vaillant eloBLOCK VE 9 kW electric heating device with a long model name</dd></div></dl>'],
                ['Commissioning Date', '<time class="df-cell-value">01.10.2026</time>'],
                ['Status', '<span class="df-pill df-pill-success">Completed</span>'],
                ['Action', '<button class="commissioning-row-action">View</button>']
            ];
            doc.body.innerHTML = `<main class="df-operations-directory ${role === 'personnel' ? 'df-personnel-commissioning-workspace' : ''}">
                <div class="df-admin-table-scroll" style="width:1400px"><table class="df-table df-commissioning-table ${firm ? 'is-firm-history' : ''}">
                <thead><tr>${columns.map(([label]) => `<th>${label}</th>`).join('')}</tr></thead>
                <tbody><tr class="df-commissioning-record-row">${columns.map(([, content]) => `<td>${content}</td>`).join('')}</tr></tbody></table></div></main>`;
            const container = doc.querySelector('.df-admin-table-scroll');
            const facts = doc.querySelector('.df-device-facts'), time = doc.querySelector('time');
            assert([...facts.querySelectorAll('dd')].every(value => win.getComputedStyle(value).fontWeight === '400'), 'Device values remain unnecessarily bold');
            assert([...facts.querySelectorAll('dt')].every(label => Number(win.getComputedStyle(label).fontWeight) <= 500), 'Device labels overpower the values');
            const row = doc.querySelector('tbody tr');
            const headers = doc.querySelectorAll('th');
            const deviceHeader = headers[firm ? 3 : 5], dateHeader = headers[firm ? 4 : 6];
            const oldWidths = firm ? ['21%', '16%'] : role === 'personnel' ? ['185px', '185px'] : ['170px', '160px'];
            for (const width of firm ? [1400, 900] : [1400, 1132]) {
                container.style.width = `${width}px`;
                deviceHeader.style.width = oldWidths[0];
                dateHeader.style.width = oldWidths[1];
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const previousWidth = deviceHeader.getBoundingClientRect().width + dateHeader.getBoundingClientRect().width;
                const previousHeight = row.getBoundingClientRect().height;
                deviceHeader.style.width = '';
                dateHeader.style.width = '';
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const gap = time.getBoundingClientRect().left - facts.getBoundingClientRect().right;
                assert(gap >= 32 && gap <= 40, `Device/date gutter is unbalanced at ${width}px: ${gap}`);
                assert(time.getBoundingClientRect().right <= time.parentElement.getBoundingClientRect().right - 5, 'Date overflows into status');
                assert(row.getBoundingClientRect().height <= previousHeight + 1, 'Spacing correction increased row height');
                assert(facts.querySelector('.df-device-model dd').getBoundingClientRect().height < 20, 'Model wraps into extra lines');
                assert(win.getComputedStyle(doc.querySelector('.df-device-model dd')).textOverflow === 'ellipsis', 'Long model truncation was lost');
                const total = deviceHeader.getBoundingClientRect().width + dateHeader.getBoundingClientRect().width;

    for (const width of [1280, 375]) {
        await test(`Long commissioning models are readable on hover, keyboard and inline detail at ${width}px`, async (doc, win, load) => {
            win.frameElement.style.width = `${width}px`;
            win.frameElement.style.height = '400px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + operationsCss;
            doc.head.append(style);
            const model = 'Vaillant eloBLOCK VE 9 kW electric heating device with a long model name <not markup>';
            doc.body.innerHTML = `<table style="margin-left:auto"><tbody><tr data-commissioning-record>
                <td><dl class="df-device-facts" style="width:160px"><div class="df-device-model"><dt>Model:</dt><dd></dd></div></dl></td>
                <td><button data-commissioning-expand aria-controls="test-model-detail" aria-expanded="false">Details</button></td></tr>
                <tr class="df-commissioning-detail-row" id="test-model-detail" hidden><td colspan="2"><div class="df-commissioning-detail-grid"><section>
                <span>Device details</span><dl class="df-commissioning-extra-facts"><div><dt>Model</dt><dd></dd></div></dl></section></div></td></tr></tbody></table>`;
            const field = doc.querySelector('.df-device-model dd');
            field.textContent = model;
            field.title = model;
            doc.querySelector('.df-commissioning-extra-facts dd').textContent = model;
            load('commissioning');
            await doc.fonts.ready;
            for (let frame = 0; frame < 3; frame++)
                await new Promise(resolve => win.requestAnimationFrame(resolve));
            const row = doc.querySelector('[data-commissioning-record]');
            const height = row.getBoundingClientRect().height;
            const tooltip = doc.querySelector('[role="tooltip"]');
            assert(field.tabIndex === 0 && field.classList.contains('is-truncated') && !field.title, 'Truncated model is not keyboard accessible or retains native tooltip');
            field.dispatchEvent(new win.PointerEvent('pointerenter', { pointerType: 'mouse' }));
            assert(!tooltip.hidden && tooltip.textContent === model && !tooltip.querySelector('not'), 'Tooltip loses or interprets model text');
            assert(field.getAttribute('aria-describedby') === tooltip.id, 'Tooltip is not associated with model');
            const rect = tooltip.getBoundingClientRect();
            assert(rect.left >= 12 && rect.right <= win.innerWidth - 11 && rect.top >= 12 && rect.bottom <= win.innerHeight - 11, 'Tooltip is clipped by viewport');
            assert(row.getBoundingClientRect().height === height, 'Tooltip changed row height');
            field.dispatchEvent(new win.PointerEvent('pointerleave', { pointerType: 'mouse' }));
            tooltip.dispatchEvent(new win.PointerEvent('pointerenter', { pointerType: 'mouse' }));
            await new Promise(resolve => win.setTimeout(resolve, 150));
            assert(!tooltip.hidden, 'Tooltip cannot be hovered to read text');
            tooltip.dispatchEvent(new win.Event('scroll'));
            assert(!tooltip.hidden, 'Tooltip closes when its own text is scrolled');
            tooltip.dispatchEvent(new win.PointerEvent('pointerleave', { pointerType: 'mouse' }));
            assert(tooltip.hidden, 'Tooltip remains after pointer leaves');
            field.focus();
            assert(!tooltip.hidden, 'Focus does not show full model');
            doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            assert(tooltip.hidden && doc.activeElement === field && !field.hasAttribute('aria-describedby'), 'Escape does not dismiss tooltip cleanly');
            field.dispatchEvent(new win.PointerEvent('pointerenter', { pointerType: 'mouse' }));
            doc.dispatchEvent(new win.Event('scroll'));
            assert(tooltip.hidden, 'Scrolling leaves tooltip floating');
            field.click();
            assert(!doc.querySelector('#test-model-detail').hidden && tooltip.hidden, 'Model click does not open full inline detail');
            assert(doc.querySelector('.df-commissioning-extra-facts dd').textContent === model, 'Inline model is incomplete');
            doc.querySelector('[data-commissioning-expand]').click();
            assert(doc.querySelector('#test-model-detail').hidden, 'Detail cannot close');
            field.textContent = 'VE 9';
            win.dispatchEvent(new win.Event('resize'));
            field.dispatchEvent(new win.PointerEvent('pointerenter', { pointerType: 'mouse' }));
            assert(tooltip.hidden && !field.hasAttribute('tabindex') && !field.classList.contains('is-truncated'), 'Short model has unnecessary tooltip or tab stop');
        });
    }

            const selected = [...doc.querySelectorAll('[data-ykc-selected-export], [data-ykc-selected-count]')];

            doc.querySelectorAll('button').forEach(button => { button.disabled = false; });

    }
