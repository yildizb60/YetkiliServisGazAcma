<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Browser Form Regression Tests</title>
<h1>Browser Form Regression Tests</h1>
<output id="summary">Running</output>
<ol id="results"></ol>
<script type="module">
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const scripts = Object.fromEntries(await Promise.all(['toast', 'drawer', 'permission', 'appointment', 'report', 'dropdown', 'commissioning', 'request'].map(async name =>
        [name, await (await fetch(`/${name}.js`)).text()])));
    const reportCss = await (await fetch('/report.css')).text();
    const requestCss = await (await fetch('/request.css')).text();
    const requestView = await (await fetch('/request-view.html')).text();
    const toastCss = await (await fetch('/toast.css')).text();
    const panelCss = (await Promise.all(['panel-layout', 'panel-unify'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const operationsCss = await (await fetch('/operations-directory.css')).text();
    const serviceEditorCss = await (await fetch('/service-editor.css')).text();
    const homeCalendarCss = (await Promise.all(['home-calendar', 'personnel-home'].map(async name =>
        await (await fetch(`/${name}.css`)).text()))).join('\n');
    const limits = await (await fetch('/appointment-limits.json')).json();
    const permissionFixture = await (await fetch('/permission-fixture.json')).json();
    const previewTest = new URLSearchParams(location.search).get('preview');
    let passed = 0, failed = 0;

    async function test(name, run) {
        if (previewTest && name !== previewTest) return;
        const frame = document.createElement('iframe');
        frame.title = name;
        document.body.append(frame);
        frame.scrollIntoView({ block: 'nearest' });
        const win = frame.contentWindow, doc = win.document;
        const errors = [];
        win.addEventListener('error', event => errors.push(event.message));
        win.addEventListener('unhandledrejection', event => errors.push(String(event.reason)));
        const load = name => {
            const script = doc.createElement('script');
            script.textContent = scripts[name];
            doc.body.append(script);
        };
        try {
            await run(doc, win, load);
            assert(!errors.length, errors.join('; '));
            passed++;
            document.querySelector('#results').insertAdjacentHTML('beforeend', `<li>PASS: ${name}</li>`);
        } catch (error) {
            failed++;
            const item = document.createElement('li');
            item.textContent = `FAIL: ${name}: ${error.message}`;
            document.querySelector('#results').append(item);
        } finally {
            if (!previewTest) frame.remove();
        }
    }

    for (const width of [377, 320]) {
        await test(`Firm appointment names remain compact and routing stays beside the time at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + homeCalendarCss;
            doc.head.append(style);
            doc.body.style.margin = '0';
            const visit = (name, routing) => `<a class="home-visit is-complete" href="#"><span class="home-visit-person">
                <strong>${name}</strong><span class="home-visit-meta"><span>Date</span><span class="home-visit-time">09:30</span>
                <span class="home-visit-assignee"><i class="bi bi-people" aria-hidden="true"></i>${routing}</span></span>
                <small>Full customer address</small><span class="home-visit-tags"><span>Installation 1311892</span><span class="df-pill df-pill-success">Completed</span></span>
                </span><i class="home-visit-menu" aria-hidden="true"></i></a>`;
            doc.body.innerHTML = `<div class="role-dashboard--certified-firm"><div class="personnel-calendar-surface"><section class="home-calendar is-firm-calendar">
                ${visit('BEDRIYE GIRAZ', '187 Acil')}${visit('GURCAN BAYRAK', 'M&#252;hendis')}${visit('Long customer name with multiple surnames', 'Atanmad&#305;')}
                </section></div></div>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            await doc.fonts.ready;
            const visits = [...doc.querySelectorAll('.home-visit')];
            const heights = visits.map(row => row.getBoundingClientRect().height);
            for (const row of visits) {
                const name = row.querySelector('strong'), time = row.querySelector('.home-visit-time'), routing = row.querySelector('.home-visit-assignee');
                const nameStyle = win.getComputedStyle(name);
                assert(nameStyle.fontSize === '12px' && nameStyle.fontWeight === '600', 'Customer name remains oversized or too bold');
                assert(Math.abs(time.getBoundingClientRect().top - routing.getBoundingClientRect().top) < 2, 'Routing wraps below the appointment time');
                assert(routing.scrollWidth <= routing.clientWidth + 1, 'Appointment routing is clipped');
                assert(name.getBoundingClientRect().right <= time.getBoundingClientRect().left, 'Customer name overlaps the time');
                routing.remove();
            }
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            const previousHeights = visits.map(row => row.getBoundingClientRect().height);
            assert(previousHeights.every((height, index) => Math.abs(height - heights[index]) < 1), `Routing increases appointment row height: ${heights} vs ${previousHeights}`);
            assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Firm appointment list overflows horizontally');
        });
    }

    for (const width of [530, 377, 320]) {
        await test(`Personnel appointment text uses lighter weights without changing layout at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + homeCalendarCss;
            doc.head.append(style);
            doc.body.style.margin = '0';
            doc.body.innerHTML = `<div class="personnel-calendar-surface"><section class="home-calendar"><a class="home-visit is-complete" href="#">
                <span class="home-visit-person is-personnel-visit"><span class="home-visit-identity"><strong>BEDRIYE GIRAZ</strong><span class="home-visit-installation">Installation 1311892</span></span>
                <span class="home-visit-primary"><span class="home-visit-time">09:30</span><span class="home-visit-assignee">187 Acil</span><span class="df-pill home-visit-state df-pill-success">Completed</span></span>
                <small>Full customer address</small></span><i class="home-visit-menu" aria-hidden="true"></i></a></section></div>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            await doc.fonts.ready;
            const row = doc.querySelector('.home-visit');
            const fields = [row.querySelector('strong'), row.querySelector('.home-visit-time'), row.querySelector('.home-visit-assignee')];
            const weights = ['600', '600', '500'], sizes = ['12px', '13px', '11.5px'];
            fields.forEach((field, index) => {
                const computed = win.getComputedStyle(field);
                assert(computed.fontWeight === weights[index] && computed.fontSize === sizes[index], 'Personnel appointment text remains heavy or changes size');
            });
            const height = row.getBoundingClientRect().height;
            const oldWeights = doc.createElement('style');
            oldWeights.textContent = '.is-personnel-visit strong { font-weight:700!important; } .is-personnel-visit .home-visit-time { font-weight:750!important; } .is-personnel-visit .home-visit-assignee { font-weight:700!important; }';
            doc.head.append(oldWeights);
            await doc.fonts.ready;
            const previousHeight = row.getBoundingClientRect().height;
            oldWeights.remove();
            assert(Math.abs(height - previousHeight) < 1, 'Lighter text changes appointment row height');
            assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Personnel appointment list overflows horizontally');
        });
    }

    for (const [viewport, panelWidth] of [[1280, 400], [1440, 530], [377, 377], [320, 320]]) {
        await test(`Four personnel appointments show their last address without scrolling at ${viewport}px`, async (doc, win) => {
            win.frameElement.style.width = `${viewport}px`;
            win.frameElement.style.height = '780px';
            const style = doc.createElement('style');
            style.textContent = panelCss + '\n' + homeCalendarCss;
            doc.head.append(style);
            doc.body.style.margin = '0';
            const visit = index => `<a class="home-visit" href="#"><span class="home-visit-person is-personnel-visit">
                <span class="home-visit-identity"><strong>Customer ${index}</strong><span class="home-visit-installation">Tesisat 1181755</span></span>
                <span class="home-visit-primary"><span class="home-visit-time">09:30</span><span class="home-visit-assignee">187 Acil</span></span>
                <small>Bahcelievler Mahallesi, apartment 17/12, Corum Merkez Corum</small>
                </span><i class="home-visit-menu" aria-hidden="true"></i></a>`;
            doc.body.innerHTML = `<aside class="personnel-calendar-surface" style="width:${panelWidth}px;${viewport > 1100 ? 'height:634px;' : ''}">
                <section class="home-calendar has-view-modes">
                    <header class="home-calendar-heading"><h2>Control appointments</h2></header>
                    <nav class="home-calendar-view-modes"><a href="#">Daily</a><a href="#">Monthly</a><a href="#">Yearly</a></nav>
                    <details class="home-calendar-filter-panel"><summary>Filter appointments</summary></details>
                    <div class="home-calendar-body"><nav class="home-month" style="height:218px;box-sizing:border-box" aria-label="Calendar"></nav>
                    <div class="home-visits"><header><h3>Control appointments</h3></header>
                        <div class="home-visits-date"><span>05 October Monday</span><small>4 appointments</small></div>
                        <div class="home-visit-list">${[1, 2, 3, 4].map(visit).join('')}</div>
                    </div></div>
                </section></aside>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            await doc.fonts.ready;
            const surface = doc.querySelector('.personnel-calendar-surface');
            const list = doc.querySelector('.home-visit-list');
            const cards = [...list.children];
            assert(surface.scrollHeight <= surface.clientHeight + 1, 'Appointments extend beyond the clipped calendar panel');
            assert(list.scrollHeight <= list.clientHeight + 1, 'Four appointments require an inner scrollbar');
            for (const card of cards) {
                const address = card.querySelector('small').getBoundingClientRect();
                assert(address.bottom <= surface.getBoundingClientRect().bottom - 2, 'Address is clipped by the outer panel');
                assert(address.bottom <= list.getBoundingClientRect().bottom + 1, 'Last address falls below the list viewport');
                assert(address.top >= card.querySelector('.home-visit-primary').getBoundingClientRect().bottom, 'Address overlaps the time or routing');
                assert(card.getBoundingClientRect().height <= 56, 'Personnel appointment card is no longer compact');
                assert(win.getComputedStyle(card.querySelector('strong')).fontSize === '12px', 'Compaction shrinks the customer name');
            }
            assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Compact appointment panel overflows horizontally');
            list.insertAdjacentHTML('beforeend', visit(5) + visit(6));
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            assert(win.getComputedStyle(list).overflowY === 'auto' && list.scrollHeight > list.clientHeight,
                'Extra appointments become inaccessible when a day has more than four records');
            list.lastElementChild.remove();
            list.lastElementChild.remove();
        });
    }

    for (const context of ['admin-page', 'admin-drawer', 'personnel']) {
        for (const width of [750, 375]) {
            await test(`Service ${context} keeps labels next to controls with supporting text at ${width}px`, async (doc, win) => {
                win.frameElement.style.width = `${width}px`;
                const style = doc.createElement('style');
                style.textContent = panelCss + '\n' + operationsCss + '\n' + serviceEditorCss;
                doc.head.append(style);
                const personnel = context === 'personnel';
                const field = personnel ? 'service-field' : 'df-admin-field';
                const fields = `<div class="${field} ${personnel ? 'service-field--span-2' : ''}"><label for="name">Firma Adi</label><input id="name" value="Corum Yetkili Servis"></div>
                    <div class="${field}"><label for="contact">Yetkili Kisi</label><input id="contact" value="Corum Yetkili Servis"></div>
                    <div class="${field}"><label for="phone">Telefon</label><input id="phone" value="03645555555"></div>
                    <div class="${field}"><label for="email">E-posta</label><input id="email" value="service@example.com"></div>
                    <div class="${field}"><label for="city">Sehir</label><select id="city"><option>Corum</option></select>
                        <div class="firma-kodu-hint is-visible">Bagli firma kodu: CORUMGAZ</div></div>
                    <div class="${field}"><label for="tax">Vergi No</label><input id="tax" value="7444444444"></div>`;
                doc.body.innerHTML = personnel
                    ? `<div class="service-editor"><div class="service-editor-fields">${fields}</div></div>`
                    : context === 'admin-drawer'
                        ? `<div class="df-directory-sheet df-admin-service-sheet is-visible"><form class="df-admin-service-editor-form"><div class="df-admin-form-grid">${fields}</div></form></div>`
                        : `<div class="df-admin-editor df-management-form"><div class="df-admin-form-grid">${fields}</div></div>`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const controls = [...doc.querySelectorAll('input, select')];
                const expectedGap = Number.parseFloat(win.getComputedStyle(controls[0].parentElement).rowGap);
                for (const control of controls) {
                    const label = control.previousElementSibling;
                    const gap = control.getBoundingClientRect().top - label.getBoundingClientRect().bottom;
                    assert(Math.abs(gap - expectedGap) < 1, `Supporting text stretches label spacing for ${control.id}: ${gap}px`);
                }
                const before = controls.map(control => control.getBoundingClientRect().top);
                doc.querySelector('.firma-kodu-hint').textContent = 'Additional supporting text '.repeat(8);
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                for (let index = 0; index < 5; index++) {
                    const control = controls[index], label = control.previousElementSibling;
                    const gap = control.getBoundingClientRect().top - label.getBoundingClientRect().bottom;
                    assert(Math.abs(gap - expectedGap) < 1, `Long supporting text separates ${control.id} from its label`);
                    if (width === 750) assert(Math.abs(control.getBoundingClientRect().top - before[index]) < 1, 'Supporting text shifts neighboring controls');
                }
                assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Service form overflows');
            });
        }
    }

    function confirmationFixture(doc, win, load) {
        doc.body.innerHTML = `<main><form data-toast-confirm action="/default" method="post">
            <input name="note" required value="ready">
            <button type="submit" name="islem" value="onayla">Approve</button>
            <button type="submit" name="islem" value="reddet" formaction="/reject" formmethod="get">Reject</button>
            </form></main><div data-operation-toast-stack></div>`;
        load('toast');
        const form = doc.querySelector('form'), submissions = [];
        doc.addEventListener('submit', event => {
            if (event.defaultPrevented) return;
            event.preventDefault();
            submissions.push({
                button: event.submitter,
                operation: new win.FormData(form, event.submitter).get('islem'),
                action: event.submitter?.getAttribute('formaction') || form.getAttribute('action'),
                method: event.submitter?.getAttribute('formmethod') || form.method
            });
        });
        const confirm = () => doc.querySelector('.is-confirm:not(.is-leaving) .is-confirm-action').click();
        return { form, submissions, confirm };
    }

    for (const operation of ['onayla', 'reddet']) {
        await test(`Confirmation preserves ${operation} submitter and overrides`, (doc, win, load) => {
            const { form, submissions, confirm } = confirmationFixture(doc, win, load);
            const button = form.querySelector(`[value="${operation}"]`);
            button.click();
            assert(!submissions.length, 'Submitted before confirmation');
            confirm();
            assert(submissions.length === 1 && submissions[0].button === button, 'Submitter lost');
            assert(submissions[0].operation === operation, 'Button name/value lost');
            assert(submissions[0].action === (operation === 'reddet' ? '/reject' : '/default'), 'Action lost');
            assert(submissions[0].method === (operation === 'reddet' ? 'get' : 'post'), 'Method lost');
            assert(!form.dataset.toastConfirmed, 'Confirmation token left behind');
        });
    }
    await test('Confirmation without a submit button still submits once', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        form.requestSubmit();
        confirm();
        assert(submissions.length === 1 && submissions[0].button === null, 'Unexpected submitter');
    });
    await test('Cancel does not submit and restores focus', (doc, win, load) => {
        const { form, submissions } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button');
        button.click();
        doc.querySelector('.is-cancel').click();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Cancelled form submitted');
        assert(doc.activeElement === button && !doc.querySelector('main').inert, 'Focus not restored');
    });
    await test('Failed native validation requires a fresh confirmation', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button'), input = form.querySelector('input');
        button.click();
        input.value = '';
        confirm();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Invalid form retained confirmation');
        input.value = 'corrected';
        button.click();
        assert(!submissions.length && doc.querySelector('.is-confirm:not(.is-leaving)'), 'Confirmation bypassed');
        confirm();
        assert(submissions.length === 1, 'Corrected form did not submit');
    });
    await test('Removed submitter cannot send a different operation', (doc, win, load) => {
        const { form, submissions, confirm } = confirmationFixture(doc, win, load);
        const button = form.querySelector('button');
        button.click();
        button.remove();
        confirm();
        assert(!submissions.length && !form.dataset.toastConfirmed, 'Detached button submitted');
    });

    const permissions = `<section class="permission-editor"><div class="permission-editor-body"><form>
        <select data-permission-company-select><option value="1">One</option><option value="2">Two</option></select>
        ${[1, 2].map(id => `<details class="company-permission" data-permission-company="${id}" open>
            <summary>Company ${id}<span class="company-permission-state"></span>
            <input type="checkbox" class="company-enable" name="sirketIds" value="${id}" checked></summary>
            <input type="checkbox" class="permission-option" name="yetkiler_${id}" value="RAPOR_GOR" checked>
            </details>`).join('')}</form></div></section>`;

    for (const width of [1280, 900, 377, 320]) {
        await test(`Permission overview matches the matrix header and keeps compact text at ${width}px`, async (doc, win) => {
            win.frameElement.style.width = `${width}px`;
            const style = doc.createElement('style');
            style.textContent = panelCss;
            doc.head.append(style);
            doc.body.style.margin = '0';
            doc.body.innerHTML = `<main class="df-permission-workspace">${permissionFixture.overview}</main>`;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            await doc.fonts.ready;
            const overview = doc.querySelector('.df-permission-overview'), matrix = doc.querySelector('.matrix-card');
            const overviewHeight = overview.getBoundingClientRect().height;
            if (width > 760) assert(Math.abs(overviewHeight - matrix.getBoundingClientRect().height) < 1, 'Summary and closed matrix heights differ');
            for (const stat of overview.children) assert(stat.getBoundingClientRect().height <= 57, 'Summary item remains unnecessarily tall');
            doc.querySelector('.matrix-head').click();
            assert(matrix.open, 'Matrix no longer opens');
            for (const cell of doc.querySelectorAll('.matrix-table tbody td')) {
                const computed = win.getComputedStyle(cell);
                assert(computed.fontSize === '11px' && computed.fontWeight === '400', 'Matrix cell text remains large or bold');
            }
            for (const role of doc.querySelectorAll('.df-role-cell')) assert(win.getComputedStyle(role).fontWeight === '600', 'Role label is too bold');
            assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Permission screen overflows horizontally');
            assert(Math.abs(overview.getBoundingClientRect().height - overviewHeight) < 1, 'Opening the matrix stretches the summary');
        });
    }

    const escapeMarkup = text => text.replace(/[&<>"']/g, value => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[value]);
    const permissionOptions = permissionFixture.options.map(({ code, label, icon }) => `<label class="permission-option-wrap">
        <input type="checkbox" class="permission-option" data-permission="${code}" name="yetkiler_1" value="${code}">
        <span class="permission-option-icon"><i class="bi ${icon}"></i></span><span class="permission-option-copy">
        <span class="permission-option-label">${escapeMarkup(label)}</span></span><span class="permission-option-check"></span></label>`).join('');
    const fullPermissions = `<section class="permission-editor"><div class="permission-editor-body"><form class="df-permission-editor-form">
        <details class="company-permission is-current" data-permission-company="1" open><summary>Company
        <span class="company-permission-state"></span><input type="checkbox" class="company-enable" name="sirketIds" value="1" checked></summary>
        <div class="permission-groups"><section class="permission-group is-blue"><div class="permission-list">${permissionOptions}</div></section></div>
        </details></form></div></section>`;

    for (const surface of ['page', 'drawer']) {
        for (const width of [660, 377]) {
            await test(`Permission ${surface} shows complete labels and keeps full-access selection rules at ${width}px`, async (doc, win, load) => {
                win.frameElement.style.width = `${width}px`;
                const style = doc.createElement('style');
                style.textContent = panelCss + '\n' + operationsCss;
                doc.head.append(style);
                doc.body.style.margin = '0';
                if (surface === 'page') {
                    doc.body.innerHTML = fullPermissions;
                    load('permission');
                } else {
                    doc.body.innerHTML = `<button class="js-admin-form-sheet-trigger" data-sheet-url="/fixture" data-sheet-variant="permission">Open</button>
                        <dialog class="df-directory-sheet" data-admin-form-sheet><h2 data-admin-form-sheet-title></h2>
                        <button data-admin-form-sheet-close>Close</button><div class="df-directory-sheet-body" data-admin-form-sheet-body></div></dialog>`;
                    win.fetch = async () => ({ ok: true, text: async () => fullPermissions });
                    load('drawer');
                    doc.querySelector('.js-admin-form-sheet-trigger').click();
                    await new Promise(resolve => win.setTimeout(resolve, 0));
                }
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                await doc.fonts.ready;
                const options = [...doc.querySelectorAll('.permission-option')];
                for (const label of doc.querySelectorAll('.permission-option-label')) {
                    assert(label.scrollWidth <= label.clientWidth + 1 && label.scrollHeight <= label.clientHeight + 1, 'Permission label is clipped');
                    assert(win.getComputedStyle(label).whiteSpace !== 'nowrap', 'Permission label cannot wrap');
                }
                const full = doc.querySelector('[data-permission="TAM_YETKI"]'), assignment = doc.querySelector('[data-permission="YKC_ATAMA_YAP"]');
                full.click();
                assert(doc.querySelector('.company-permission-state').textContent === 'T\u00fcm \u0130\u015flem Yetkileri A\u00e7\u0131k', 'Full access state does not describe operation permissions');
                assert(options.every(option => option.checked === (option === full)), 'Full access does not clear individual options');
                assignment.click();
                assert(!full.checked && assignment.checked && doc.querySelector('[data-permission="YKC_TALEP_GOR"]').checked, 'Assignment selection broke dependent permissions');
                assert(doc.querySelector('.company-permission-state').textContent === '2 \u0130\u015flem Yetkisi Se\u00e7ili', 'Selected permission count has an incomplete label');
                doc.querySelector('[data-permission="YKC_TALEP_GOR"]').click();
                assert(doc.querySelector('.company-permission-state').textContent === '\u0130\u015flem Yetkisi Se\u00e7ilmedi', 'Empty selection appears authorized');
                assignment.click();
                const company = doc.querySelector('.company-enable');
                company.click();
                assert(options.every(option => option.disabled), 'Disabled company retains active controls');
                assert(doc.querySelector('.company-permission-state').textContent === '\u015eirket Yetkileri Kapal\u0131', 'Disabled scope label does not identify company permissions');
                company.click();
                assert(assignment.checked && options.every(option => !option.disabled), 'Re-enabling company loses the selection');
                assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, 'Permission form overflows horizontally');
            });
        }
    }

    for (const surface of ['page', 'drawer']) {
        await test(`Company switching preserves selections in ${surface}`, async (doc, win, load) => {
            if (surface === 'page') {
                doc.body.innerHTML = permissions;
                load('permission');
            } else {
                doc.body.innerHTML = `<button class="js-admin-form-sheet-trigger" data-sheet-url="/fixture" data-sheet-variant="permission">Open</button>
                    <dialog data-admin-form-sheet><h2 data-admin-form-sheet-title></h2>
                    <button data-admin-form-sheet-close>Close</button><div data-admin-form-sheet-body></div></dialog>`;
                // The drawer loads only this synthetic form, never application records.
                win.fetch = async () => ({ ok: true, text: async () => permissions });
                load('drawer');
                doc.querySelector('.js-admin-form-sheet-trigger').click();
                await new Promise(resolve => win.setTimeout(resolve, 0));
            }
            const companies = [...doc.querySelectorAll('[data-permission-company]')];
            const select = doc.querySelector('select');
            for (const selected of ['1', '2', '1']) {
                select.value = selected;
                select.dispatchEvent(new win.Event('change'));
                for (const company of companies) {
                    const current = company.dataset.permissionCompany === selected;

    function warningClock(win) {
        const nativeSetTimeout = win.setTimeout.bind(win), nativeClearTimeout = win.clearTimeout.bind(win);
        const timers = new Map();
        let now = 0, nextId = -1;
        win.setTimeout = (callback, delay, ...args) => {
            if (delay < 12000) return nativeSetTimeout(callback, delay, ...args);
            const id = nextId--;
            timers.set(id, { due: now + delay, callback: () => callback(...args) });
            return id;
        };
        win.clearTimeout = id => { if (!timers.delete(id)) nativeClearTimeout(id); };
        return { advance(ms) {
            now += ms;
            for (const [id, timer] of timers) {
                if (timer.due <= now) { timers.delete(id); timer.callback(); }
            }
        }, get count() { return timers.size; } };
    }

                <details class="ykc-firm-data-section ykc-firm-history-panel"><summary><h2 id="firm-history-title"><i class="bi bi-clock-history" aria-hidden="true"></i>İşlem Geçmişi <small>1 kayıt</small></h2><i class="bi bi-chevron-down" aria-hidden="true"></i></summary><ol class="ykc-firm-history"><li><time>05.10.2026 10:30</time><strong>Talep oluşturuldu</strong></li></ol></details></aside></div></section></main>`;
            await until(() => icons.sheet);
            await doc.fonts.ready;
            await new Promise(resolve => win.requestAnimationFrame(resolve));
            const sections = [...doc.querySelectorAll('.ykc-firm-data-section')];
            assert(sections.every(x => win.getComputedStyle(x).boxShadow === 'none'), 'Individual colored frames remain');
            assert(sections.every(x => win.getComputedStyle(x).borderLeftWidth === '0px' && win.getComputedStyle(x).borderRightWidth === '0px'), 'Sections are still boxed');
            const separator = win.getComputedStyle(sections[1]);
            assert(separator.borderTopStyle === 'solid' && parseFloat(separator.borderTopWidth) > 0 && parseFloat(separator.borderTopWidth) <= 1, 'Thin section separator is missing');
            assert(sections.every(x => x.scrollWidth <= x.clientWidth + 1), 'Section overflows');
            assert(win.getComputedStyle(sections[1]).backgroundColor === 'rgb(255, 249, 247)'
                && win.getComputedStyle(sections[2]).backgroundColor === 'rgb(244, 250, 248)'
                && win.getComputedStyle(sections[3]).backgroundColor === 'rgb(255, 255, 255)',
                'Device and company tones are not soft and distinct from the white history area');
            assert(new Set(sections.slice(0, 3).map(x => win.getComputedStyle(x.querySelector('h2')).color)).size === 3,
                'Section headings lack a clear color hierarchy');
            const measure = () => sections.map(x => {
                const box = x.getBoundingClientRect();
                return [box.x, box.y, box.width, box.height];
            });
            const geometry = JSON.stringify(measure());
            const previousColors = doc.createElement('style');
            previousColors.textContent = '.ykc-firm-record * { color:#213b53!important; background-color:#fff!important; border-color:#e1e8f1!important; }';
            doc.head.append(previousColors);
            assert(JSON.stringify(measure()) === geometry, 'Changing the colors changes section geometry');
            previousColors.remove();
        });
    }
    for (const width of [1280, 900, 390]) {
        for (const state of ['pending', 'approved', 'rejected']) {
            await test(`Approval ${state} details use balanced space without extra height at ${width}px`, async (doc, win) => {
                win.frameElement.style.width = `${width}px`;
                const style = doc.createElement('style');
                style.textContent = panelCss + operationsCss;
                doc.head.append(style);
                doc.body.innerHTML = `<main class="df-approval-workspace"><div class="df-approval-table-wrap"><div class="df-approval-detail-grid">
                    <div><span>Vergi No</span><strong>1919191960</strong></div>
                    <div><span>Yetkili Kisi</span><strong>Yigit Ahlat</strong></div>
                    <div><span>Telefon</span><strong>05530139628</strong></div>
                    <div><span>Il</span><strong>Corum</strong></div>
                    <div class="is-valid"><span>Bitis Durumu</span><strong>53 gun kaldi</strong></div>
                    <div class="is-wide"><span>Firma Adresi</span><strong>Bahcelievler mah. Bahabey Sokak. Ahlatci Plaza</strong></div>
                    ${state !== 'pending' ? '<div><span>Karar Tarihi</span><strong>05.10.2026 10:30</strong></div>' : ''}
                    ${state === 'rejected' ? '<div class="is-wide"><span>Red Gerekcesi</span><strong>Belge tarih araligi ile firma bilgileri uyusmuyor.</strong></div>' : ''}
                    </div></div></main>`;
                await new Promise(resolve => win.requestAnimationFrame(resolve));
                const grid = doc.querySelector('.df-approval-detail-grid');
                const fields = [...grid.children];
                const text = grid.textContent;
                const height = grid.getBoundingClientRect().height;
                const boxes = fields.map(field => field.getBoundingClientRect());
                assert(fields.every(field => field.scrollWidth <= field.clientWidth + 1), 'Detail text overflows');
                if (width > 760 && state === 'pending') {
                    assert(boxes.slice(0, 5).every(box => Math.abs(box.top - boxes[0].top) < 1), 'Short facts do not share one five-column row');
                    assert(Math.abs(boxes[5].left - boxes[0].left) < 1 && Math.abs(boxes[5].right - boxes[4].right) < 1, 'Address does not span the full detail width');
                    const addressLabel = fields[5].querySelector('span').getBoundingClientRect();
                    const addressValue = fields[5].querySelector('strong').getBoundingClientRect();
                    assert(addressValue.left >= addressLabel.right && Math.abs(addressValue.top - addressLabel.top) < 4, 'Address label and value are not on the same compact line');
                }
                const baseline = doc.createElement('style');
                baseline.textContent = `.df-approval-detail-grid { grid-template-columns:repeat(${width > 760 ? 4 : 2},minmax(0,1fr))!important; }
                    .df-approval-detail-grid > div { grid-area:auto!important; }
                    .df-approval-detail-grid > div.is-wide { grid-column:${width > 760 ? 'span 2' : '1 / -1'}!important; }`;
                doc.head.append(baseline);
                assert(height <= grid.getBoundingClientRect().height + 1, 'New layout increases detail height');
                baseline.remove();
                assert(grid.textContent === text, 'Details were added or removed');
            });
        }
    }
    document.querySelector('#summary').textContent = `${passed} passed, ${failed} failed`;
</script>
</html>
